# Rebuilds the games table in README.md from each folder's row.md after every
# push to main, so builds never edit the README themselves and parallel builds
# cannot conflict on it. See .github/scripts/build_readme.py.
name: rebuild README games table
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild the table
        run: python3 .github/scripts/build_readme.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README: rebuild games table from row.md files"
          git pull --rebase origin main
          git push origin HEAD:main
